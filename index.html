 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q2 Skills Test</title>

<link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
<script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
      
      body {
    background: linear-gradient(135deg, #e6cbff);
    min-height: 100vh;
    font-family: "Times New Roman", serif;
}
    
.main-container {
    max-width: 900px;
    min-height: 1000px;
    margin: auto;

}

    .btn{
        background-color: #b65cff;
        border: none;
        border-radius: 12px;
        padding: 12px 30px;
        font-weight: bold;
        color: rgb(244, 234, 250);
        }

        
        
    .btn:hover {
            background-color: #b351f0;
        }

        #result {
            background-color: #ebcaff;
            border: 2px solid #b670f8;
            border-radius: 15px;
         padding: 20px;
            text-align: left;;
            font-size: 1.3rem;
            font-weight: bold;
            color: #ca98ff;
        }
    </style>
    </head>
<body>
    <br><br><br>
    <div class="container bg-light main-container p-5">
        <h1 class="text-center"> THE NON METALS IN SCIENCE</h1>
        <h3 class="text-center"> Periodic table non metal finder</h3>
    <br><br>
    <form>
        <div class="row">
            <div class="col">
                <label for="element1" class="form-label"><b>Search for a non-metal element</b></label>
                <br>
                <input type="text" id="element1" name="element1" class="form-control" placeholder="Type element (ex. Hydrogen)..." required>
            </div>
         </div>
                    <br>
                    <div class="row">
                    <div class="col">
                        <button class="btn w-100" type="button" py-click="Search">Enter</button>
                        </div>
        </div>
        <br>
        <div class="row">
            <div id="result">
            <p>Element Name: <span id="name"></span></p>
                <p>Element Symbol: <span id="symbol"></span></p>
                <p>Atomic Number: <span id="number"></span></p>
                <p>Atomic Mass: <span id="mass"></span></p></div>
        </div>
         </form>
        <br>
</div>
<br><br>
<script type ="py" src="main.py"></script>
</body>
</html>
